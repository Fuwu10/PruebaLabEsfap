server.port=8080
# Base de datos local (H2 en archivo ./data). Para PostgreSQL cambie url, driver y dependencia.
spring.datasource.url=jdbc:h2:file:./data/esfap;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
# Sesión: cierre por inactividad y cookie protegida
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Con HTTPS (TLS 1.2+) active tambien: server.servlet.session.cookie.secure=true
